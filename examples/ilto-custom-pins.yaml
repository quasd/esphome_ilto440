# Same as ilto-minimal.yaml, but with the MAX485's DI and DE/RE on other pins.
#
# Wiring for this example (only these two wires differ from docs/wiring.svg):
#   DI         <- D1 (GPIO5)    instead of D2 (GPIO4)
#   DE + RE    <- D6 (GPIO12)   instead of D5 (GPIO14)
#
# Not tested on hardware - the tested unit uses the default pins.

substitutions:
  name: ilto-440
  friendly_name: ILTO 440
  # The pins. Leave out any you don't change; the defaults are in the comments.
  ilto_tx_pin: GPIO5            # to DI       (default GPIO4 / D2)
  ilto_flow_control_pin: GPIO12 # to DE + RE  (default GPIO14 / D5)
  # ilto_bus_inverted: "false"  # if the MAX485's RO idles high (default "true": RO idles low)
  # ilto_rx_pin cannot change: receiving needs GPIO13 / D7.
  # Don't use GPIO15 / D8: the board will not boot with the MAX485 on it.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: nodemcuv2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

packages:
  ilto: github://quasd/esphome_ilto440/packages/ilto_premium.yaml@main
