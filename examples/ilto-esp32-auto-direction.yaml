# ESP32 (30-pin "NodeMCU ESP-WROOM-32" board) with a 3.3 V RS-485 module that switches between
# sending and receiving by itself - the MAX3485 boards with only VCC, GND, TXD and RXD on the
# logic side. Reading tested on an ILTO 440 Premium (CASA bus layout, see the README).
#
# Wiring:
#   ESP32 3V3      -> module VCC
#   ESP32 GND      -> module GND -> the cable's GND
#   ESP32 TX2 (GPIO17), RX2 (GPIO16) -> the module's TXD / RXD. The labels on these modules differ:
#                     if the log shows "bytes 0", swap the two wires.
#   module A       -> the cable's middle wire that reads ~3.2 V to GND
#   module B       -> the middle wire that reads ~1.5 V
#   The cable's ~5 V wire stays unconnected. Leave the module's 120 ohm terminator (R16) open.
#
# Such a module drives the bus only while its TX input is low, so the bus must not be inverted:
# ilto_bus_inverted stays "false", and polarity is fixed by connecting A and B the right way
# round (swap the wires rather than the setting).
#
# The tested unit uses the CASA bus layout (see the README), where the panel's 3-step control
# (Away / Home / Boost) is known but the speed, power, fireplace and clock commands are not. So
# this file adds the Ventilation mode select, drops the package's Ventilation (speed) select, and
# keeps the clock sync off. On an ILTO-layout unit, leave those three changes out.

substitutions:
  name: ilto-440
  friendly_name: ILTO 440

  ilto_rx_pin: GPIO16
  ilto_tx_pin: GPIO17
  # Not wired: the module switches direction itself, but the component expects a pin.
  ilto_flow_control_pin: GPIO4
  ilto_bus_inverted: "false"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# The package moves the log to UART1 for the ESP8266; the ESP32 has UARTs to spare, so keep it on
# UART0 (USB).
logger:
  hardware_uart: UART0

packages:
  ilto: github://quasd/esphome_ilto440/packages/ilto_premium.yaml@main

ilto_premium:
  # CASA layout: Away / Home / Boost, and the boost minutes.
  step_mode:
    name: "Ventilation mode"
  boost_time:
    name: "Boost time"
    filters:
      - delta: 0.5
  # The speed select's commands are not known on the CASA layout.
  mode: !remove
  # Sensors this unit does not have (the panel shows 0, or 110-111 for a temperature):
  temperature_7: !remove
  co2: !remove
  humidity: !remove
  supply_fan_rpm: !remove
  extract_fan_rpm: !remove

# The clock command is not known on the CASA layout: keep the clock sync off.
switch:
  - id: !extend ilto_clock_sync
    restore_mode: ALWAYS_OFF
